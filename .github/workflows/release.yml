name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Verify tag matches VERSION
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag_ver="${TAG_NAME#v}"
          root_ver="$(tr -d '[:space:]' < VERSION)"
          skill_ver="$(tr -d '[:space:]' < skills/study/VERSION)"
          if [ "$tag_ver" != "$root_ver" ] || [ "$root_ver" != "$skill_ver" ]; then
            echo "Version mismatch: tag=$tag_ver root=$root_ver skill=$skill_ver" >&2
            exit 1
          fi

      - name: Run lint_study.py --dist-check
        run: uv run skills/study-feedback/scripts/lint_study.py --dist-check

      - name: Extract changelog notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os, pathlib, re
          ver = os.environ["TAG_NAME"].lstrip("vV")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pat = re.compile(rf"^##\s+\[?v?{re.escape(ver)}\]?(?:\s|$)")
          lines, collecting, out = text.splitlines(), False, []
          for line in lines:
              if line.startswith("## "):
                  if collecting:
                      break
                  if pat.match(line.strip()):
                      collecting = True
                      continue
              elif collecting:
                  out.append(line)
          pathlib.Path("/tmp/release-notes.md").write_text("\n".join(out).strip() + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            if [ -s /tmp/release-notes.md ] && grep -q '[^[:space:]]' /tmp/release-notes.md; then
              gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file /tmp/release-notes.md
            else
              gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
            fi
          fi
