[project]
name = "study-plot-helper"
version = "0.1.0"
description = "Reusable Matplotlib styling and scientific diagram helpers for the study skill"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["plot_helper.py"]
